services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 10
  init-db:
    image: amazon/aws-cli:2.27.14
    depends_on:
      dynamodb: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws dynamodb create-table --table-name taskforge-tasks
        --attribute-definitions AttributeName=task_id,AttributeType=S
        --key-schema AttributeName=task_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        --endpoint-url http://dynamodb:8000 --region us-east-1 > /dev/null 2>&1;
        do aws dynamodb describe-table --table-name taskforge-tasks
        --endpoint-url http://dynamodb:8000 --region us-east-1 > /dev/null 2>&1
        && exit 0; sleep 2; done
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      TASKS_TABLE: taskforge-tasks
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
    depends_on:
      init-db: { condition: service_completed_successfully }
    restart: unless-stopped
